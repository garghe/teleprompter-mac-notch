name: Build macOS app

on:
  push:
  workflow_dispatch:

# Least privilege: the job only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      # Third-party actions pinned to exact commits (tags can be moved).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent NotchPrompter.app NotchPrompter.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NotchPrompter
          path: build/NotchPrompter.zip
